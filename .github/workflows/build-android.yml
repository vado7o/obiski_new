name: Android Build
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Clean and Install Dependencies
        run: |
          cd mobile
          rm -f package-lock.json
          npm cache clean --force
          npm install --legacy-peer-deps --no-audit --no-fund

      - name: Generate Local Android Folder
        run: |
          cd mobile
          # Генерируем проект
          npx expo prebuild --platform android --no-install

      - name: Build AAB (Release Mode, Play Store)
        run: |
          cd mobile/android
          chmod +x gradlew
          # Собираем AAB для загрузки в Google Play
          ./gradlew bundleRelease --no-daemon

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          # Путь к AAB для Google Play
          path: mobile/android/app/build/outputs/bundle/release/app-release.aab

